<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact Exporter for WA Web</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Metinler _locales/<dil>/messages.json dosyalarından gelir (data-i18n anahtarları). -->
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28" />
    <div class="title">
      <h1>Contact Exporter for WA Web</h1>
      <p class="privacy">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>
        <span data-i18n="privacy"></span>
      </p>
    </div>
  </header>

  <!-- Durum ekranları -->
  <section id="state-loading" class="state">
    <div class="spinner"></div>
    <p data-i18n="loading"></p>
  </section>

  <section id="state-message" class="state" hidden>
    <p id="msg-title" class="msg-title"></p>
    <p id="msg-body" class="msg-body"></p>
    <button id="msg-action" class="primary" hidden></button>
    <details id="msg-details" hidden><summary data-i18n="technicalDetails"></summary><pre id="msg-pre"></pre></details>
  </section>

  <!-- Sonuç ekranı -->
  <section id="state-result" hidden>
    <p class="summary"><strong id="count-selected">0</strong> / <span id="count-total">0</span> <span data-i18n="selectedSuffix"></span></p>

    <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />

    <div class="list-head">
      <label><input type="checkbox" id="select-all" checked /> <span data-i18n="selectAllVisible"></span></label>
    </div>
    <ul id="list"></ul>

    <div class="options">
      <label><input type="checkbox" id="opt-unsaved" /> <span data-i18n="optUnsaved"></span></label>
      <label><span data-i18n="numberFormat"></span>
        <select id="opt-format">
          <option value="e164"></option>
          <option value="intl"></option>
          <option value="local"></option>
          <option value="idd"></option>
          <option value="digits"></option>
        </select>
      </label>
      <label id="row-country" hidden><span data-i18n="country"></span>
        <select id="opt-country"></select>
      </label>
      <p id="country-note" class="note" data-i18n="countryNote" hidden></p>
      <label><input type="checkbox" id="opt-excel" checked /> <span data-i18n="optExcel"></span></label>
    </div>

    <div class="actions">
      <button id="dl-csv" class="secondary" data-i18n="downloadCsv"></button>
      <button id="dl-vcf" class="primary" data-i18n="exportVcf"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
