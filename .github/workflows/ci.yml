name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs
      - run: npm test

      - name: Mağaza zip'ini üret
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          mkdir -p dist
          (cd extension && zip -r "../dist/contact-exporter-wa-web-$VERSION.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

      - name: Etiketlenen sürüm için GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
